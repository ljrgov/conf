# ============ 路由规则 ============
# 规则优先级：从上到下依次匹配，命中即停止
rules:
  # -------- DNS 相关规则 --------
  - DST-PORT,53,🌐 DNS_Hijack # 将发自 53 端口的 DNS 请求送进 DNS 模块而不是作为链接显示
  # -------- 自定义规则优先 --------
  - RULE-SET,直连名单,国内直连名单
  - RULE-SET,代理名单,海外代理名单
  #- PROCESS-NAME,sub_store_node,订阅更新

  # -------- 功能性拦截规则 --------
  - RULE-SET,WebRTC_端/域,WebRTC
  - DST-PORT,3478/5349-5350/10000/19302,WebRTC
  - RULE-SET,No-ads-all_域,广告拦截
  - RULE-SET,Category-DoH,广告拦截
  - RULE-SET,HTTPDNS-CN,广告拦截
  - DOMAIN-KEYWORD,v6.gh-proxy,DIRECT
  - DOMAIN-SUFFIX,pool.ntp.org,DIRECT
  - DOMAIN,time.is,DIRECT

  # -------- 独立/特定分流规则 --------
  # --- PikPak--
  - DOMAIN,access.pikpakdrive.com,REJECT
  - DOMAIN,access.mypikpak.com,REJECT
  - DOMAIN,access.mypikpak.net,REJECT
  - DOMAIN,access.pikpak.me,REJECT
  - DOMAIN-KEYWORD,dl-a10b-,DIRECT
  - DOMAIN-KEYWORD,dl-z01a-,DIRECT
  - DOMAIN-REGEX,^dl-[A-Za-z0-9-]+\.mypikpak\.com$,DIRECT
 
  # --- BT/PT 下载分流---
  - DOMAIN-KEYWORD,ipv6tracker,Tracker
  - DOMAIN-KEYWORD,bittorrent,Tracker
  - DOMAIN-KEYWORD,torrent,Tracker
  - DOMAIN-KEYWORD,tracker,Tracker
  - RULE-SET,PublicTracker,Tracker
  - RULE-SET,Trackers,Tracker
  - RULE-SET,Xunlei,Tracker

  # --- 极致优化：游戏下载 CDN 及国区平台强制直连 ---
  - DOMAIN-KEYWORD,steamcontent,DIRECT
  - DOMAIN-KEYWORD,origin-a,DIRECT
  - RULE-SET,GameDownload,DIRECT
  - RULE-SET,Blizzard,DIRECT
  - RULE-SET,Ubisoft,DIRECT
  - RULE-SET,GamesCN,DIRECT
  # --- 国际游戏平台客户端登录及社区策略--

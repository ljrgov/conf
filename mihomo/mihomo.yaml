# 基本配置
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
ipv6: false
mode: Rule
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: silent  # 可选 trace / debug / info / warning / error [静默 silent ]
find-process-mode: always
disable-keep-alive: true
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
updatetime: &Time 86400
geox-url:
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
experimental:
  http-headers:
    request:
      - name: "User-Agent"
        value: "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Mobile Safari/537.36"
      - name: "Accept-Language"
        value: "en-US,en;q=0.9"  
external-controller: 127.0.0.1:9090
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages-no-fonts.zip"
external-ui: "./webroot/Zash/"
secret: "" # 面板访问密码

# 局域网与热点共享免密及路由优化
skip-auth-prefixes:
  - 127.0.0.1/32     # 本机访问
  - 192.168.43.0/24  # 常见 Android 热点网段
  - 172.20.10.0/24   # 常见 iOS 热点网段

# 订阅健康检查
proxy: &proxy
  type: http
  interval: 86400
  health-check: { enable: true, url: http://www.gstatic.com/generate_204, interval: 600, lazy: true }
  proxy: 订阅更新
  exclude-filter: '(?i)官网|邀请|到期|流量|更新|验证|剩余|频道|长期|推广|分享|周期|我的'
  header:
      User-Agent: ["clash-verge/v2.5.2", "ClashMetaForAndroid/2.11.26.Meta"]

# 订阅地址相关
proxy-providers:
  subs:
    <<: *proxy
    # override:
      # additional-prefix: "subs " #节点前缀名
    path: ./providers/subs
    url: "http://127.0.0.1:3000/download/subs"

# 节点记忆
profile:
  store-selected: true
  store-fake-ip: true

# host模块
hosts:
  'dns.alidns.com': ['223.5.5.5', '223.6.6.6']
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'dns.cloudflare.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']
  'cn.bing.com': ['global.bing.com']
  'services.googleapis.cn': ['services.googleapis.com'] # 解决谷歌商店无法下载的问题
  'google.cn': ['google.com']
  '+.mcdn.bilivideo.com': ['0.0.0.0'] # 屏蔽哔哩哔哩PCDN，解决访问视频卡顿问题
  '+.mcdn.bilivideo.cn': ['0.0.0.0']
  '+.edge.mountaintoys.cn': ['0.0.0.0']
  '+.h2.smtcdns.net': ['0.0.0.0']
  
# 嗅探模块
sniffer:
  enable: true
  force-dns-mapping: true # 对 redir-host 类型识别的流量进行强制嗅探
  parse-pure-ip: true # 对所有未获取到域名的流量进行强制嗅探
  override-destination: false # 使用嗅探结果作为实际访问
  sniff: # 嗅探的协议设置
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 5228, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain: # 强制嗅探
    - "+.v2ex.com"
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain: # 如遇需内部通信的应用请放行该域名
    - "Mijia Cloud"
    - "+.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.apple.com"
    - "+.push.apple.com"

# 网卡模块 (深度调优热点转发与网络拓扑)
tun:
  enable: false
  device: Meta
  stack: mixed
  dns-hijack: ['any:53', 'tcp://any:53']
  udp-timeout: 300
  auto-route: true
  strict-route: false # 必须设为 false，确保热点客户端流量可以正常通过主路由转发
  auto-redirect: true
  auto-redirect-interface: true
  endpoint-independent-nat: true # 开启 Full Cone NAT，全面优化多设备共享环境下的游戏联机
  exclude-package: # 如黑白名单这里需排除
    # _____________________# 三星专供 ↓ 范围
#    - com.samsung.android.messaging
#    - com.samsung.android.app.telephonyui
#    - com.samsung.android.dialer
#    - com.samsung.android.incallui
#    - com.samsung.android.smartcallprovider
#    - com.samsung.android.intellivoiceservice
#    - com.android.settings
#    - com.qti.qcc
#    - com.sec.epdg
#    - com.sec.imsservice # 三星专供 ↑ 范围
    # 非三星用户不必理会，三星用户需自行取消注释
# —————————
  
# ebpf入站设置
# 需使用此内核：https://github.com/TanakaLun/mihomo    
listeners:
  - name: ebpf-in
    type: ebpf
    mode: hybrid         # local / shared / hybrid    
    dns-mode: hijack    # DNS 处理模式：hijack（默认）/ off。若 DNS 模式为 fake-ip，此处则请不要使用 off
    bypass-rule-set:    # 目标 IP 命中这些 rule-set 的 CIDR 时直接走内核
      - geoip-cn # rule-set 的 tag，允许 behavior: ipcidr 的 rule-set 整体提取，对于 behavior: classical 的 rule-set 则是提取其中的 IP-CIDR 规则
    local:              
      ipv6-mode: auto     # 本机 IPv6 拦截：auto（默认）/ always / off。auto 探测原生 IPv6 路由并动态开关
      include-package: []   # Android 专用：仅拦截这些应用包名的流量
      exclude-package: [ # Android 专用：排除这些应用包名的流量
        "com.miui.mishare.connectivity", # 小米互传（无线直连传输协议底层）
        "com.xiaomi.mi_connect_service", # 小米互联服务（跨端设备发现与连接核心）
        "com.milink.service", # 小米妙享/米联（投屏、音视频与数据流转）
        "com.coloros.oshare", # OPPO互传（控制中心互传开关、文件快传底层）
        "com.oplus.synergy", # 跨屏互联/O+互联（手机与电脑/平板协同、多端流转）
        "com.heytap.accessory" # 智能配件快连（负责快速发现周围无线生态设备）
      ]
    shared:  # 热点转发
      interface: ["wlan2"]    # mode 为 hybrid 或 shared时必填
      ipv6-mode: always       # 共享 IPv6 拦截：always（默认）/ off
      
# 国内外 DNS 定义
chinaDNS: &chinaDNS ['https://dns.alidns.com/dns-query#DIRECT', 'https://doh.pub/dns-query#DIRECT']
foreignDNS: &foreignDNS ['https://dns.cloudflare.com/dns-query#总模式', 'https://dns.google/dns-query#总模式']

# DNS模块
dns:
  enable: true
  use-hosts: true
  ipv6: false
  cache-algorithm: arc
  prefer-h3: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  # respect-rules: true # 在 DNS 模式为 redir-host 式让境外 DoH 走代理,解决 ERR_NAME_NOT_RESOLVED
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fc00::/18
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,Fake-IP-Filter,real-ip
    - RULE-SET,FCM_域,real-ip
    - RULE-SET,CN_域,real-ip
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver: *chinaDNS
  proxy-server-nameserver: *chinaDNS
  nameserver-policy:
    'rule-set:No-ads-all_域,WebRTC_端/域': ['rcode://success']
    'rule-set:CN_域,FCM_域': *chinaDNS
  nameserver: *foreignDNS

# 特殊代理节点定义
proxies: [ {name: 🌐 DNS_Hijack, type: dns} ]

# 应用分流配置模版
app_groups: &app_groups
    type: select
    proxies:
      - 总模式
      - 延迟最低
      - 故障转移
      - 负载均衡
      - 手动选择
      - 美国节点
      - 香港节点
      - 狮城节点
      - 日本节点
      - 台湾节点
      - 其他节点
      - DIRECT
      - REJECT

# 地区过滤器正则表达式定义
HK_filter: &HK_filter { filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HK(?![A-Za-z])|hong\s*kong)' }
JP_filter: &JP_filter { filter: '(?i)(🇯🇵|日本|(?<![A-Za-z])JP(?![A-Za-z])|japan)' }
US_filter: &US_filter { filter: '(?i)(🇺🇸|美国|(?<![A-Za-z])US(?![A-Za-z])|america|united\s*states)' }
SG_filter: &SG_filter { filter: '(?i)(🇸🇬|新加坡|狮城|(?<![A-Za-z])SG(?![A-Za-z])|singapore)' }
TW_filter: &TW_filter { filter: '(?i)(🇹🇼|台湾|(?<![A-Za-z])TW(?![A-Za-z])|taiwan)' }
exclude_filter: &exclude_filter { exclude-filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HK(?![A-Za-z])|hong\s*kong|🇯🇵|日本|(?<![A-Za-z])JP(?![A-Za-z])|japan|🇺🇸|美国|(?<![A-Za-z])US(?![A-Za-z])|america|united\s*states|🇸🇬|新加坡|狮城|(?<![A-Za-z])SG(?![A-Za-z])|singapore|🇹🇼|台湾|(?<![A-Za-z])TW(?![A-Za-z])|taiwan)', exclude-type: 'DIRECT' }

# 策略组通用配置
group_select: &group_select { type: select, interval: 600, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, url: 'https://g.cn/generate_204', lazy: true, icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Static.png' }
group_auto: &group_auto { type: url-test, interval: 600, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, url: 'https://g.cn/generate_204', lazy: true, tolerance: 50, include-all-providers: true, exclude-type: 'DIRECT', icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png' }
group_load: &group_load { type: load-balance, interval: 600, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, url: 'https://g.cn/generate_204', lazy: true, strategy: 'sticky-sessions', include-all-providers: true, exclude-type: 'DIRECT', icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Round_Robin_1.png' }
group_health: &group_health { type: fallback, interval: 7200, timeout: 5000, url: 'https://g.cn/generate_204', lazy: true, icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available_1.png' }


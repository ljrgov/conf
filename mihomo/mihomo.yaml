# ============ 规则集锚点定义 ============
rule-anchor:
  Local: &Local
    {type: file, behavior: classical, format: text}
  IPCIDR: &IPCIDR
    {type: http, behavior: ipcidr, format: mrs, interval: 86400}
  Domain: &Domain
    {type: http, behavior: domain, format: mrs, interval: 86400}

# ============ 规则集配置 ============
rule-providers:
  # 本地自定义规则，使用前自行创建etc文件夹和相关文件
  直连名单:
    <<: *Local
    path: ./etc/直连名单.list
  代理名单:
    <<: *Local
    path: ./etc/代理名单.list
  
  # cnip绕过规则
  geoip-cn:
    <<: *IPCIDR
    path: ./rules/cnip.mrs
    url: "https://github.com/samqvz/DIY-Ruleset/raw/publish/mihomo/cn_ip.mrs"
  
  #gfw相关规则
  gfw:
    <<: *Domain
    path: ./rules/gfw.mrs
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/gfw.mrs'

  # 过滤，广告净化规则
  WebRTC_端/域:
    <<: *Domain
    path: ./rules/WebRTC.mrs
    url: "https://github.com/5MayRain/rule/raw/refs/heads/main/rule/Mihomo/STUN/Domain_STUN.mrs"
  Fake-IP-Filter:
    <<: *Domain
    path: ./rules/Fake-IP-Filter.mrs
    url: "https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/fakeip-filter.mrs" 
  No-ads-all_域:
    <<: *Domain
    path: ./rules/No-ads-all.mrs
    url: "https://github.com/TG-Twilight/AWAvenue-Ads-Rule/raw/refs/heads/main/Filters/AWAvenue-Ads-Rule-Clash.mrs"  
  Private_域:
    <<: *Domain
    path: ./rules/Private.mrs
    url: "https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/private.mrs"
  Private_IP:
    <<: *IPCIDR
    path: ./rules/Private_IP.mrs
    url: "https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/privateip.mrs"  
  HTTPDNS-CN:
    <<: *Domain
    path: ./rules/category-httpdns-cn.mrs
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-httpdns-cn.mrs"
  Category-DoH:
    <<: *Domain
    path: ./rules/category-doh.mrs
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-doh.mrs"

  # 国内直连规则
  CN_IP:
    <<: *IPCIDR
    path: ./rules/CN_IP.mrs
    url: "https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/cnip.mrs"
  CN_域:
    <<: *Domain
    path: ./rules/CN_域.mrs
    url: "https://raw.githubusercontent.com/DustinWin/ruleset_geodata/refs/heads/mihomo-ruleset/cn.mrs"
  XiaoHongShu_域:
    <<: *Domain
    path: ./rules/XiaoHongShu.mrs
    url: "https://github.com/peiyingyao/Rule-for-OCD/raw/refs/heads/master/rule/Clash/XiaoHongShu/XiaoHongShu_OCD_Domain.mrs"
  DouYin_域:
    <<: *Domain
    path: ./rules/DouYin.mrs
    url: "https://github.com/peiyingyao/Rule-for-OCD/raw/refs/heads/master/rule/Clash/DouYin/DouYin_OCD_Domain.mrs"
  BiliBili_域:
